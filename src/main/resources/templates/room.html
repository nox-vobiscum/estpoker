<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale}" lang="en">
<head th:replace="~{fragments/head :: head(page='room')}"></head>
<body class="page-room">

  <!-- App menu (fragment) -->
  <div th:replace="~{fragments/app-header :: appHeader}"></div>
  <div th:replace="~{fragments/menu :: appMenu(showSeq=${true}, showAuto=${true}, showRoom=${true})}"></div>
  <th:block th:replace="~{fragments/app-header :: headerScripts}"></th:block>

  <div class="container" role="main">
    <h1 class="sr-only"><span th:text="#{label.room}">Room:</span> <span th:text="${roomCode}">demo</span></h1>

    <dl class="main-info">
      <dt><span class="mi-icon" aria-hidden="true">👤</span><span class="mi-label" th:text="#{label.you}" data-i18n="label.you">You are:</span></dt>
      <dd><strong id="youName" th:text="${participantName}">Guest</strong></dd>

      <dt><span class="mi-icon" aria-hidden="true">🆔</span><span class="mi-label" th:text="#{label.room}" data-i18n="label.room">Room:</span></dt>
      <dd>
        <div class="room-with-actions">
          <strong id="roomCodeVal" th:text="${roomCode}">demo</strong>
          <button id="copyRoomLink"
                  class="icon-button"
                  type="button"
                  th:attr="aria-label=#{invite.copyLink},title=#{invite.copyLink}"
                  data-i18n-attr="aria-label:invite.copyLink;title:invite.copyLink"
                  aria-live="polite">🔗</button>
        </div>
      </dd>
    </dl>

    <h2 th:text="#{label.participants}" data-i18n="label.participants">Participants</h2>

    <!-- Live participants list.
         ARIA: polite live region so screen readers get updates without being too disruptive. -->
    <ul id="liveParticipantList" role="list" aria-live="polite" aria-busy="false"></ul>

    <!-- Host label template: JS can clone this when marking a participant as Host.
         Accessible: title + aria-label; i18n-ready via data-i18n-attr.
         Visual styling will be added in styles.css using the .host-label selector. -->
    <template id="hostLabelTpl">
      <span class="host-label"
            title="Host"
            aria-label="Host"
            data-i18n-attr="title:label.host;aria-label:label.host">👑</span>
    </template>

    <!-- Active estimation topic panel (inline edit for hosts) -->
    <div id="topicRow" class="topic-row is-hidden" hidden aria-labelledby="topicPanelHeading">
      <svg class="topic-panel-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M9 5h6m-7 4h8m-8 4h8m-8 4h5M9 3h6a2 2 0 0 1 2 2h2v16H5V5h2a2 2 0 0 1 2-2Z"/>
      </svg>
      <div class="topic-content">
        <span id="topicPanelHeading" class="topic-heading"
              th:text="#{topic.current.heading}" data-i18n="topic.current.heading">CURRENT ESTIMATION TOPIC</span>
        <span id="topicDisplay" class="topic-text">–</span>
        <a id="topicTicketLink" class="topic-ticket-link" href="#" target="_blank"
           rel="noopener noreferrer" hidden
           th:text="#{topic.openLink}" data-i18n="topic.openLink">Open ticket</a>
      </div>
      <div class="topic-actions"></div>
    </div>

    <!-- Result row (always present; space is reserved even when hidden) -->
    <p id="resultRow"
       class="average-label consensus-row result-row is-hidden">

      <!-- Long+short labels + dedicated consensus label -->
      <span id="resultLabel" class="label">
        <span class="label-average" th:text="#{label.average}" data-i18n="label.average">Average:</span>
        <span class="label-consensus" hidden>🎉 Consensus</span>
      </span>

      <span id="averageVote" class="value">–</span>

      <span id="medianSep" class="sep" hidden aria-hidden="true"> • </span>

      <span id="medianWrap" class="stat" hidden>
        <span id="medianLabel" class="label" th:text="#{label.median}" data-i18n="label.median">Median:</span>
        <span id="medianVote" class="value">–</span>
      </span>

      <span id="rangeSep" class="sep" hidden aria-hidden="true"> • </span>

      <span id="rangeWrap" class="stat" hidden>
        <span id="rangeLabel" class="label" th:text="#{label.range}" data-i18n="label.range">Range:</span>
        <span id="rangeVote" class="value">–</span>
      </span>

    </p>
    <!-- Persistent live region outside the conditionally hidden visual result. -->
    <span id="resultAnnounce" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span>

    <!-- Card grid (always visible; disabled after reveal via body class + JS) -->
    <div class="card-grid" id="cardGrid"></div>

    <!-- Actions (host): we toggle only buttons, never the container -->
    <div class="vote-actions">
      <button type="button" id="revealButton" class="button" hidden
              th:text="#{button.reveal}" data-i18n="button.reveal"
              th:attr="title=#{button.reveal},aria-label=#{button.reveal}"
              data-i18n-attr="title:button.reveal;aria-label:button.reveal"
              onclick="revealCards()"></button>

      <button type="button" id="resetButton" class="button" hidden
              th:text="#{button.reset}" data-i18n="button.reset"
              th:attr="title=#{button.reset},aria-label=#{button.reset}"
              data-i18n-attr="title:button.reset;aria-label:button.reset"
              onclick="resetRoom()"></button>
    </div>

    <div th:replace="~{fragments/kbase :: kbase}"></div>

    <div class="room-exit-row">
      <button id="leaveRoomBtn" type="button" class="room-exit-action"
              th:attr="aria-label=#{room.leave},title=#{room.leave}"
              data-i18n-attr="aria-label:room.leave;title:room.leave">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4m5-4 4-4-4-4m4 4H9"/>
        </svg>
        <span th:text="#{room.leave}" data-i18n="room.leave">Leave room</span>
      </button>
    </div>

  </div>

  <!-- Room connector (bump v-param if clients cache JS) -->
  <script defer th:src="@{/js/room.js?v=59}"
          th:attr="data-participant=${participantName},data-room=${roomCode}"></script>

  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
