<!-- templates/fragments/menu.html -->
<th:block th:fragment="appMenu (showSeq, showAuto, showRoom)">

  <!-- Overlay root -->
  <div id="appMenuOverlay" class="menu-overlay hidden" aria-hidden="true" hidden>
    <div class="menu-backdrop" data-close></div>

    <div class="menu-panel" role="dialog" aria-modal="true"
         aria-labelledby="menuTitle" tabindex="-1">

      <!-- Header / title -->
      <div class="menu-header">
        <h3 id="menuTitle" data-i18n="menu.settings">Settings</h3>
        <button id="menuCloseButton" class="icon-button" type="button"
                th:attr="aria-label=#{menu.close},title=#{menu.close}"
                data-i18n-attr="aria-label:menu.close;title:menu.close"
                aria-label="Close menu" title="Close menu">&#x2715;</button>
      </div>

      <!-- Reuse the existing language adapter on narrow screens. -->
      <div class="menu-section mobile-language" role="group" aria-labelledby="menuLanguageHeading">
        <h4 id="menuLanguageHeading" class="section-title" data-i18n="menu.language">Language</h4>
        <div th:replace="~{fragments/header-controls :: languageControls(prefix='menuLang')}"></div>
      </div>

      <!-- Theme -->
      <div class="menu-section" role="group" aria-labelledby="menuThemeHeading">
        <h4 id="menuThemeHeading" class="section-title" data-i18n="menu.theme">Theme</h4>
        <div id="menuTheme" class="preference-control" role="group"
             th:attr="aria-label=#{menu.theme}" aria-label="Theme">
          <button id="themeLight"  type="button" class="preference-seg" data-theme-mode="light" aria-pressed="false"
                  th:attr="title=#{theme.light},aria-label=#{theme.light}"
                  data-i18n-attr="title:theme.light;aria-label:theme.light">
            <svg th:replace="~{fragments/app-header :: themeLightIcon}"></svg>
          </button>
          <button id="themeDark"   type="button" class="preference-seg" data-theme-mode="dark" aria-pressed="false"
                  th:attr="title=#{theme.dark},aria-label=#{theme.dark}"
                  data-i18n-attr="title:theme.dark;aria-label:theme.dark">
            <svg th:replace="~{fragments/app-header :: themeDarkIcon}"></svg>
          </button>
          <button id="themeSystem" type="button" class="preference-seg" data-theme-mode="system" aria-pressed="false"
                  th:attr="title=#{theme.system},aria-label=#{theme.system}"
                  data-i18n-attr="title:theme.system;aria-label:theme.system">
            <svg th:replace="~{fragments/app-header :: themeSystemIcon}"></svg>
          </button>
        </div>
      </div>

      <!-- Interface style is independent of the color theme. -->
      <div class="menu-section" role="group" aria-labelledby="menuUiStyleHeading">
        <h4 id="menuUiStyleHeading" class="section-title" th:text="#{menu.uiStyle}" data-i18n="menu.uiStyle">Interface style</h4>
        <div id="menuUiStyle" class="preference-control" role="group"
             th:attr="aria-label=#{menu.uiStyle}" aria-label="Interface style">
          <button id="uiStyleDev" type="button" class="preference-seg" data-ui-style-mode="dev" aria-pressed="true"
                  th:attr="title=#{title.uiStyle.dev},aria-label=#{title.uiStyle.dev}"
                  data-i18n-attr="title:title.uiStyle.dev;aria-label:title.uiStyle.dev">
            <span class="mi-icon" aria-hidden="true">{ &gt;_ }</span>
            <span th:text="#{uiStyle.dev}" data-i18n="uiStyle.dev">Dev</span>
          </button>
          <button id="uiStyleClean" type="button" class="preference-seg" data-ui-style-mode="clean" aria-pressed="false"
                  th:attr="title=#{title.uiStyle.clean},aria-label=#{title.uiStyle.clean}"
                  data-i18n-attr="title:title.uiStyle.clean;aria-label:title.uiStyle.clean">
            <svg class="mi-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true" focusable="false">
              <path d="M20.2 3.8a5.5 5.5 0 0 1 0 7.8L10 21H3v-7L12.4 3.8a5.5 5.5 0 0 1 7.8 0Z"/>
              <path d="m3 21 14-14M9 15h7"/>
            </svg>
            <span th:text="#{uiStyle.clean}" data-i18n="uiStyle.clean">Clean</span>
          </button>
        </div>
      </div>

      <!-- Card sequence -->
      <div class="menu-section menu-section--sequence" role="group" aria-labelledby="menuSequenceHeading" th:if="${showSeq}">
        <h4 id="menuSequenceHeading" class="section-title" data-i18n="menu.sequence">Card sequence [👑]</h4>
        <fieldset id="menuSeqChoice" class="menu-choice vertical">
          <label class="radio-row">
            <input type="radio" name="menu-seq" value="fib.scrum" checked>
            <span data-i18n="sequence.fib.scrum">Fibonacci (Scrum basic)</span>
          </label>
          <label class="radio-row">
            <input type="radio" name="menu-seq" value="fib.enh">
            <span data-i18n="sequence.fib.enh">Fibonacci (Scrum enhanced)</span>
          </label>
          <label class="radio-row">
            <input type="radio" name="menu-seq" value="fib.math">
            <span data-i18n="sequence.fib.math">Fibonacci (mathematical)</span>
          </label>
          <label class="radio-row">
            <input type="radio" name="menu-seq" value="pow2">
            <span data-i18n="sequence.pow2">Powers of 2</span>
          </label>
          <label class="radio-row">
            <input type="radio" name="menu-seq" value="tshirt">
            <span data-i18n="sequence.tshirt">T-Shirt sizes</span>
          </label>
        </fieldset>
      </div>

      <!-- Room functions -->
      <div class="menu-section menu-section--room" role="group" aria-labelledby="menuRoomHeading" th:if="${showRoom}">
        <h4 id="menuRoomHeading" class="section-title" data-i18n="menu.roomFunctions">Room functions [👑]</h4>

        <!-- Auto-reveal -->
        <div class="menu-item switch" role="group" id="rowAutoReveal"
             th:attr="title=#{menu.autoreveal}" data-i18n-attr="title:menu.autoreveal">
          <span class="mi-icon" aria-hidden="true">⚡</span>
          <div class="switch-text">
            <strong data-i18n="menu.autoreveal">Auto-reveal</strong>
            <span id="menuArStatus" data-i18n="toggle.off">Off</span>
          </div>
          <input id="menuAutoRevealToggle" class="switch-control" type="checkbox" role="switch"
                 aria-checked="false" th:attr="aria-label=#{menu.autoreveal}"
                 data-i18n-attr="aria-label:menu.autoreveal" aria-label="Auto-reveal">
        </div>

        <!-- Topic toggle -->
        <div class="menu-item switch" role="group" id="rowTopic"
             th:attr="title=#{menu.topic}" data-i18n-attr="title:menu.topic">
          <span class="mi-icon" aria-hidden="true">🧾</span>
          <div class="switch-text">
            <strong data-i18n="label.topic">Ticket/Story</strong>
            <span id="menuTopicStatus" data-i18n="toggle.off">Off</span>
          </div>
          <input id="menuTopicToggle" class="switch-control" type="checkbox" role="switch"
                 aria-checked="false" th:attr="aria-label=#{label.topic}"
                 data-i18n-attr="aria-label:label.topic" aria-label="Ticket/Story">
        </div>

    <!-- Specials (row + inline palette) -->
    <div class="menu-item switch has-expand" role="group" id="rowSpecials"
        th:attr="title=#{menu.specials}" data-i18n-attr="title:menu.specials">
      <span class="mi-icon" aria-hidden="true">🎴</span>
      <div class="switch-text">
        <strong data-i18n="menu.specials">Allow special cards</strong>
        <span id="menuSpecialsStatus" data-i18n="toggle.on">On</span>
      </div>
      <input id="menuSpecialsToggle" class="switch-control" type="checkbox" role="switch"
            aria-checked="true" checked th:attr="aria-label=#{menu.specials}"
            data-i18n-attr="aria-label:menu.specials" aria-label="Allow special cards">

      <!-- Inline palette (hidden when switch is OFF) -->
      <div id="rowSpecialsPick" class="specials-pick" hidden aria-hidden="true" data-row="specials-palette">
      <!-- Inline actions (visible only when palette is expanded) -->
      

      <div class="specials-icons" role="group" aria-label="Special cards">

          <button type="button" class="spc" data-id="coffee"     aria-pressed="false" title="Coffee / short break"><span class="ico">☕</span></button>
          <button type="button" class="spc" data-id="speech"     aria-pressed="false" title="Needs separate discussion"><span class="ico">💬</span></button>
          <button type="button" class="spc" data-id="telescope"  aria-pressed="false" title="Spike / exploration first"><span class="ico">🔭</span></button>
          <button type="button" class="spc" data-id="waiting"    aria-pressed="false" title="Waiting for prerequisite"><span class="ico">⏳</span></button>
          <button type="button" class="spc" data-id="dependency" aria-pressed="false" title="Depends on another task"><span class="ico">🔗</span></button>
          <button type="button" class="spc" data-id="risk"       aria-pressed="false" title="Notable risks"><span class="ico">⚠️</span></button>
          <button type="button" class="spc" data-id="relevance"  aria-pressed="false" title="Check goals/vision first"><span class="ico">🎯</span></button>
        </div>


<div class="specials-actions">
        <button
          type="button"
          id="spcSelectAll"
          class="link-btn"
          data-i18n="menu.specials.selectAll"
          data-i18n-attr="title:menu.specials.selectAll.hint;aria-label:menu.specials.selectAll"
          title="Select all specials"
          aria-label="Select all specials">
          Select all
        </button>
      </div>



      </div>
    </div>




        <!-- Hard mode -->
        <div class="menu-item switch" role="group" id="rowHardMode"
             th:attr="title=#{menu.hardmode}" data-i18n-attr="title:menu.hardmode">
          <span class="mi-icon" aria-hidden="true">🧱</span>
          <div class="switch-text">
            <strong data-i18n="menu.hardmode">Hard mode</strong>
            <span id="menuHardStatus" data-i18n="toggle.off">Off</span>
          </div>
          <input id="menuHardModeToggle" class="switch-control" type="checkbox" role="switch"
                 aria-checked="false" th:attr="aria-label=#{menu.hardmode}"
                 data-i18n-attr="aria-label:menu.hardmode" aria-label="Hard mode">
        </div>
      </div>

      <!-- Personal functions -->
      <div class="menu-section menu-section--personal" role="group" aria-labelledby="menuPersonalHeading">
        <h4 id="menuPersonalHeading" class="section-title" data-i18n="menu.personalFunctions">Personal functions</h4>
        <div class="menu-item switch" role="group" id="rowParticipation"
             th:attr="title=#{menu.participation}" data-i18n-attr="title:menu.participation">
          <span class="mi-icon" aria-hidden="true">🧑‍💻</span>
          <div class="switch-text">
            <strong data-i18n="menu.participation">Participation</strong>
            <span id="menuPartStatus" data-i18n="participation.imIn">I'm estimating</span>
          </div>
          <input id="menuParticipationToggle" class="switch-control" type="checkbox" role="switch"
                 aria-checked="true" checked th:attr="aria-label=#{menu.participation}"
                 data-i18n-attr="aria-label:menu.participation" aria-label="Participation">
        </div>
      </div>

      <!-- Close room -->
      <div class="menu-section menu-section--secondary" role="group" aria-labelledby="menuSecondaryHeading" th:if="${showRoom}">
        <h4 id="menuSecondaryHeading" class="section-title" data-i18n="menu.secondaryActions">More actions</h4>
        <button id="closeRoomBtn" type="button" class="menu-item danger"
                th:attr="title=#{room.close},aria-label=#{room.close}"
                data-i18n-attr="title:room.close;aria-label:room.close"
                aria-label="Close room for everyone">
          <span class="mi-icon" aria-hidden="true">❌</span>
          <span class="truncate-1" data-i18n="room.close">Close room for everyone</span>
        </button>
      </div>
    </div>
  </div>

  <!-- *** Tiny bridge: keeps topic toggle ↔ row in sync *** -->
  <script>
  (function(){
    function $(id){ return document.getElementById(id); }
    function setTopicVisible(on){
      var row = $('topicRow');
      if (row){
        row.classList.toggle('is-hidden', !on);
        row.hidden = !on;
        try { row.style.display = on ? '' : 'none'; } catch {}
      }
      if (document.body) document.body.dataset.topicVisible = String(!!on);
      try { document.dispatchEvent(new CustomEvent('pp:topic:set', { detail:{ visible: !!on } })); } catch {}
    }
    function init(){
      var t = $('menuTopicToggle'), s = $('menuTopicStatus');
      if (!t) return;
      // initial apply from aria-checked/checked
      var aria = t.getAttribute('aria-checked');
      var on = aria === 'true' ? true : aria === 'false' ? false : !!t.checked;
      setTopicVisible(on);
      if (s) s.textContent = on ? (document.querySelector('[data-i18n="menu.on"]')?.textContent || 'On')
                                : (document.querySelector('[data-i18n="menu.off"]')?.textContent || 'Off');
      t.addEventListener('change', function(){
        var aria = t.getAttribute('aria-checked');
        var on = aria === 'true' ? true : aria === 'false' ? false : !!t.checked;
        setTopicVisible(on);
      });
      // expose for tests / other scripts
      window.setTopicVisible = setTopicVisible;
    }
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); }
    else { init(); }
  })();
  </script>

    <!-- Load JS -->
  <script defer src="/js/menu.js?v=48"></script>
  <script defer src="/js/specials-bridge.js?v=2"></script>

</th:block>
