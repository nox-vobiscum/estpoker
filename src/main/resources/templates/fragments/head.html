<!-- Central <head> fragment for all pages -->
<!-- Usage in a page:
     <head th:replace="~{fragments/head :: head(page='home')}"></head>
-->
<th:block th:fragment="head(page)"
          th:with="publicPage=${page == 'home' or page == 'about'}, titleKey=${page == 'about' ? 'seo.about.title' : (page == 'home' ? 'seo.home.title' : 'app.title.short')}, descriptionKey=${page == 'about' ? 'seo.about.description' : 'seo.home.description'}, canonicalUrl=${page == 'about' ? 'https://ep.rbsnet.at/about' : 'https://ep.rbsnet.at/'}">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="color-scheme" content="dark light"/>

  <!-- Page-specific metadata uses the existing runtime translation attributes. -->
  <title th:text="${#messages.msg(titleKey)}" th:attr="data-i18n=${titleKey}">RBS' Estimation Poker</title>
  <meta th:if="${page == 'room'}" name="robots" content="noindex, nofollow"/>

  <th:block th:if="${publicPage}">
    <meta name="description" th:content="${#messages.msg(descriptionKey)}" th:attr="data-i18n-attr=${'content:' + descriptionKey}"/>
    <link rel="canonical" th:href="${canonicalUrl}"/>
    <meta property="og:title" th:content="${#messages.msg(titleKey)}" th:attr="data-i18n-attr=${'content:' + titleKey}"/>
    <meta property="og:description" th:content="${#messages.msg(descriptionKey)}" th:attr="data-i18n-attr=${'content:' + descriptionKey}"/>
    <meta property="og:url" th:content="${canonicalUrl}"/>
    <meta property="og:type" content="website"/>
    <meta property="og:image" content="https://ep.rbsnet.at/favicon-512.png"/>
    <meta property="og:image:width" content="512"/>
    <meta property="og:image:height" content="512"/>
    <meta property="og:site_name" content="RBS' Estimation Poker"/>
    <meta property="og:locale" th:content="#{seo.locale}" data-i18n-attr="content:seo.locale"/>
    <meta name="twitter:card" content="summary"/>
    <meta name="twitter:title" th:content="${#messages.msg(titleKey)}" th:attr="data-i18n-attr=${'content:' + titleKey}"/>
    <meta name="twitter:description" th:content="${#messages.msg(descriptionKey)}" th:attr="data-i18n-attr=${'content:' + descriptionKey}"/>
    <meta name="twitter:image" content="https://ep.rbsnet.at/favicon-512.png"/>
  </th:block>

  <!-- Only the homepage describes the application; no unverified rating claims. -->
  <script th:if="${page == 'home'}" type="application/ld+json" th:inline="javascript">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "RBS' Estimation Poker",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "url": "https://ep.rbsnet.at/",
    "description": /*[[#{seo.application.description}]]*/ "Free online Planning Poker tool for Scrum and Agile teams.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
  }
  </script>
  <!-- === i18n messages exposed for room.js (toasts, confirms, labels) === -->
  <!-- Presence & rename toasts -->
  <meta name="msg.toast.participantLeft"    th:content="#{toast.participantLeft}"/>
  <meta name="msg.toast.participantRenamed" th:content="#{toast.participantRenamed}"/>

  <!-- Host transfer toasts (manual/auto) -->
  <meta name="msg.toast.hostTransferred.to"     th:content="#{toast.hostTransferred.to}"/>
  <meta name="msg.toast.hostTransferred.fromTo" th:content="#{toast.hostTransferred.fromTo}"/>

  <!-- Copy feedback (both legacy + new keys for back-compat) -->
  <meta name="msg.invite.linkCopied" th:content="#{invite.linkCopied}"/>
  <meta name="msg.notify.copyFailed" th:content="#{notify.copyFailed}"/>
  <meta name="msg.copy.ok"           th:content="#{copy.ok}"/>
  <meta name="msg.copy.fail"         th:content="#{copy.fail}"/>

  <!-- Reveal gating (hard mode) -->
  <meta name="msg.reveal.gate" th:content="#{reveal.gate}"/>

  <!-- Confirms -->
  <meta name="msg.confirm.clear"      th:content="#{confirm.clear}"/>
  <meta name="msg.confirm.closeRoom"  th:content="#{confirm.closeRoom}"/>
  <meta name="msg.confirm.makeHost"   th:content="#{confirm.makeHost}"/>
  <meta name="msg.confirm.kick"       th:content="#{confirm.kick}"/>

  <!-- Menu short labels -->
  <meta name="msg.menu.on"           th:content="#{menu.on}"/>
  <meta name="msg.menu.off"          th:content="#{menu.off}"/>
  <meta name="msg.menu.imEstimating" th:content="#{menu.imEstimating}"/>
  <meta name="msg.menu.spectator"     th:content="#{menu.spectator}"/>

  <!-- Labels used in result bar -->
  <meta name="msg.label.consensus" th:content="#{label.consensus}"/>

  <!-- Special-card tooltips -->
  <meta name="msg.card.tip.question" th:content="#{card.tip.question}"/>
  <meta name="msg.card.tip.coffee"  th:content="#{card.tip.coffee}"/>

  <!-- Name conflict (optional feature) -->
  <meta name="msg.name.conflict.title"       th:content="#{name.conflict.title}"/>
  <meta name="msg.name.conflict.hint"        th:content="#{name.conflict.hint}"/>
  <meta name="msg.name.conflict.suggestion"  th:content="#{name.conflict.suggestion}"/>

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}"/>
  <link rel="alternate icon" th:href="@{/favicon.ico}" sizes="any"/>
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32x32.png}"/>
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon-16x16.png}"/>
  <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}"/>

  <!-- Web App Manifest -->
  <link rel="manifest" th:href="@{/manifest.json}"/>

  <!-- Early theme apply (prevents flash) -->
  <script>
    (function(){try{
      var t=localStorage.getItem('estpoker-theme')||'dark';
      if(t==='system')document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme',t);
    }catch(e){}})();
    (function(){
      var style='dev';
      try{if(localStorage.getItem('ep-ui-style')==='clean')style='clean';}catch(e){}
      document.documentElement.setAttribute('data-ui-style',style);
    })();
  </script>

  <!-- Base styles -->
  <link rel="stylesheet" th:href="@{/styles.css?v=44}"/>
</th:block>
