<!-- Shared shell; functional page headings remain in page content. -->
<header th:fragment="appHeader" class="app-header">
  <a class="app-brand" th:href="@{/}">
    <img src="/favicon.svg" alt="" width="24" height="24">
    <span th:text="#{ui.heading}" data-i18n="ui.heading">RBS' Planning Poker</span>
  </a>
  <div class="app-utilities">
    <div class="desktop-language">
      <div th:replace="~{fragments/header-controls :: headerControls}"></div>
    </div>

    <div class="desktop-theme">
      <div class="theme-control" role="group" th:attr="aria-label=#{menu.theme}" aria-label="Theme">
        <button id="hcThemeLight" class="theme-seg" type="button" data-theme-mode="light"
                aria-pressed="false" th:attr="title=#{title.theme.light},aria-label=#{title.theme.light}"
                data-i18n-attr="title:title.theme.light;aria-label:title.theme.light">
          <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
        <button id="hcThemeDark" class="theme-seg" type="button" data-theme-mode="dark"
                aria-pressed="false" th:attr="title=#{title.theme.dark},aria-label=#{title.theme.dark}"
                data-i18n-attr="title:title.theme.dark;aria-label:title.theme.dark">
          <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M20.5 15.1A8.5 8.5 0 0 1 8.9 3.5 8.5 8.5 0 1 0 20.5 15.1Z"/>
          </svg>
        </button>
        <button id="hcThemeSystem" class="theme-seg" type="button" data-theme-mode="system"
                aria-pressed="false" th:attr="title=#{title.theme.system},aria-label=#{title.theme.system}"
                data-i18n-attr="title:title.theme.system;aria-label:title.theme.system">
          <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>
          </svg>
        </button>
      </div>
    </div>

  <button id="menuButton"
          class="menu-button"
          type="button"
          aria-haspopup="dialog"
          aria-expanded="false"
          th:attr="title=#{menu.open},aria-label=#{menu.open}"
          data-i18n-attr="title:menu.open;aria-label:menu.open"
          aria-label="Open menu"
          title="Open menu">☰</button>
  </div>
</header>
<!-- Load after menu scripts to preserve the existing language bridge order. -->
<th:block th:fragment="headerScripts">
  <script defer src="/js/header-controls.js?v=17"></script>
</th:block>
