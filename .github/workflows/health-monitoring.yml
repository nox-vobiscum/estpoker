name: Health Check Monitoring (Vienna time, DST-safe)

on:
  schedule:
    - cron: "*/30 * * * *"   # alle 30 Minuten (UTC)
  workflow_dispatch:          # optional: manuell startbar

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Run only 06-23 Europe/Vienna (optionally Mon-Fri)
        shell: bash
        run: |
          export TZ=Europe/Vienna
          HOUR=$(date +%H)
          DOW=$(date +%u) # 1=Mon ... 7=Sun
          # Uncomment next line to skip weekends:
          # if [ "$DOW" -gt 5 ]; then echo "Weekend → skip"; exit 0; fi
          if [ "$HOUR" -lt 6 ] || [ "$HOUR" -gt 23 ]; then
            echo "Outside 06-23 Vienna (current: ${HOUR}h) → skipping."
            exit 0
          fi

      - name: Check application health endpoint (8s timeout)
        run: |
          curl -fsS --max-time 8 https://ep.noxvobiscum.at/healthz || true
